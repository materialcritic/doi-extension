<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOI Grabber — Scan Page for DOIs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #17171a;
      --surface: #212126;
      --surface-2: #2a2a30;
      --surface-2-hover: #34343c;
      --border: #34343c;
      --text: #ece9e4;
      --text-dim: #9d9a94;
      --accent: #c98a4b;
      --accent-hover: #dd9c5c;
      --accent-text: #201406;
      --ok: #4caf78;
      --err: #e0574a;
      --warn: #d9a441;
    }

    :root[data-theme="parchment"] {
      --bg: #f2ece0;
      --surface: #ffffff;
      --surface-2: #e7ddc8;
      --surface-2-hover: #dccdae;
      --border: #d8cbae;
      --text: #2a2723;
      --text-dim: #726a5c;
      --accent: #b4783c;
      --accent-hover: #c68a4d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #b47f1a;
    }

    :root[data-theme="slate"] {
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-2: #e3e8ee;
      --surface-2-hover: #d3dae3;
      --border: #d3dae3;
      --text: #23282f;
      --text-dim: #6b7280;
      --accent: #4f6d8f;
      --accent-hover: #5f7fa3;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #b47f1a;
    }

    :root[data-theme="sage"] {
      --bg: #f0f2ec;
      --surface: #ffffff;
      --surface-2: #e4e8dc;
      --surface-2-hover: #d4dac6;
      --border: #d4dac6;
      --text: #262b22;
      --text-dim: #6f7566;
      --accent: #6b8e5a;
      --accent-hover: #7fa06d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #b47f1a;
    }

    :root[data-theme="minimal"] {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-2: #f0f0f0;
      --surface-2-hover: #e2e2e2;
      --border: #dddddd;
      --text: #111111;
      --text-dim: #6e6e6e;
      --accent: #111111;
      --accent-hover: #333333;
      --accent-text: #ffffff;
      --ok: #1a7a4c;
      --err: #b3261e;
      --warn: #96690f;
    }

    :root[data-theme="carrot"] {
      --bg: #fdf3e7;
      --surface: #ffffff;
      --surface-2: #fbe4c4;
      --surface-2-hover: #f5d4a4;
      --border: #f0c98a;
      --text: #3a2410;
      --text-dim: #8a6a3c;
      --accent: #e8752c;
      --accent-hover: #f28943;
      --accent-text: #ffffff;
      --ok: #4a8f3c;
      --err: #c0392b;
      --warn: #b4791a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 820px;
      margin: 0 auto;
      padding-bottom: 48px;
    }

    header {
      padding: 24px 24px 16px;
      display: flex;
      align-items: flex-start;
    }

    header .header-text { flex: 1; min-width: 0; }

    header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    header p {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #btn-theme-toggle {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    #btn-theme-toggle:hover { background: var(--surface-2-hover); }

    #toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 12px 24px 16px;
      border-bottom: 1px solid var(--border);
    }

    #toolbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button:hover:not(:disabled) { background: var(--surface-2-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
    }

    button.primary:hover:not(:disabled) { background: var(--accent-hover); }

    #totals-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    #status-text {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    #progress-bar-wrap {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    #list {
      padding: 16px 24px 0;
    }

    .work-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      margin-bottom: 8px;
      font-size: 12px;
    }

    .row-checkbox {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      cursor: pointer;
      margin-top: 2px;
    }

    .row-checkbox:disabled { cursor: default; }

    .work-main {
      flex: 1;
      min-width: 0;
    }

    .work-title {
      overflow-wrap: break-word;
    }

    .work-title.clickable {
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
      text-decoration-color: var(--text-dim);
    }

    .work-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .work-doi {
      font-size: 10.5px;
      color: var(--text-dim);
      margin-top: 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: break-word;
    }

    .work-flag {
      display: inline-block;
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--warn);
    }

    .work-abstract-inline {
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-dim);
      padding-top: 6px;
    }

    .work-status {
      flex-shrink: 0;
      color: var(--text-dim);
      min-width: 90px;
      text-align: right;
      margin-top: 2px;
    }

    .work-status.ok { color: var(--ok); }
    .work-status.err { color: var(--err); }
    .work-status.active { color: var(--accent); }

    .work-row.row-skip { opacity: 0.55; }
    .work-row.row-skip .work-title { color: var(--text-dim); }

    #error, #empty {
      padding: 40px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    #error { color: var(--err); }

    #loading {
      padding: 16px 24px 0;
    }

    .skeleton-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 14px 16px;
      margin-bottom: 8px;
    }

    .skeleton-bar {
      height: 11px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: skeleton-pulse 1.4s ease-in-out infinite;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <script src="theme.js"></script>
  <script src="redact.js"></script>
  <script src="logger.js"></script>
</head>
<body>
  <header>
    <div class="header-text">
      <h1 id="page-title">Scan Page for DOIs</h1>
      <p id="subtitle">Scanning…</p>
    </div>
    <button id="btn-theme-toggle" title="Toggle theme" data-theme-icon>☀</button>
  </header>

  <div id="toolbar" style="display: none;">
    <div id="toolbar-controls">
      <button id="btn-select-all">Select All</button>
      <button id="btn-select-none">Select None</button>
      <button id="btn-start" class="primary">Download Selected</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-cancel" disabled>Cancel</button>
      <button id="btn-open-folder" style="display: none;">Open Folder in Finder</button>
    </div>
    <div id="totals-text"></div>
    <div id="status-text"></div>
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="loading">
    <div class="skeleton-row"><div class="skeleton-bar" style="width: 60%;"></div></div>
    <div class="skeleton-row"><div class="skeleton-bar" style="width: 45%;"></div></div>
    <div class="skeleton-row"><div class="skeleton-bar" style="width: 55%;"></div></div>
    <div class="skeleton-row"><div class="skeleton-bar" style="width: 40%;"></div></div>
  </div>
  <div id="error" style="display: none;"></div>
  <div id="empty" style="display: none;">No DOIs found on this page.</div>

  <div id="list"></div>

  <script src="path-utils.js"></script>
  <script src="page-scan.js"></script>
</body>
</html>
