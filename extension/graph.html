<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DOI Grabber — Citation Snowball Graph</title>
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #17171a;
    --surface: #212126;
    --surface-2: #2a2a30;
    --border: #34343c;
    --text: #ece9e4;
    --text-dim: #9d9a94;
    --accent: #c98a4b;
    --err: #e0574a;
    --ok: #6fae6f;
    /* Fixed categorical colors for the graph's three node/edge kinds — kept
       stable across all 6 themes (same reasoning as the QR code staying
       plain black/white regardless of theme) so the legend never drifts. */
    --teal: #1D9E75;
    --coral: #D85A30;
    --purple: #7F77DD;
  }

  :root[data-theme="parchment"] {
    --bg: #f2ece0;
    --surface: #ffffff;
    --surface-2: #e7ddc8;
    --border: #d8cbae;
    --text: #2a2723;
    --text-dim: #726a5c;
    --accent: #b4783c;
    --err: #c0392b;
    --ok: #4c7a3f;
  }

  :root[data-theme="slate"] {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #e3e8ee;
    --border: #d3dae3;
    --text: #23282f;
    --text-dim: #6b7280;
    --accent: #4f6d8f;
    --err: #c0392b;
    --ok: #3f7d5c;
  }

  :root[data-theme="sage"] {
    --bg: #f0f2ec;
    --surface: #ffffff;
    --surface-2: #e4e8dc;
    --border: #d4dac6;
    --text: #262b22;
    --text-dim: #6f7566;
    --accent: #6b8e5a;
    --err: #c0392b;
    --ok: #4c7a3f;
  }

  :root[data-theme="minimal"] {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --surface-2: #f0f0f0;
    --border: #dddddd;
    --text: #111111;
    --text-dim: #6e6e6e;
    --accent: #111111;
    --err: #b3261e;
    --ok: #2e7d32;
  }

  :root[data-theme="carrot"] {
    --bg: #fdf3e7;
    --surface: #ffffff;
    --surface-2: #fbe4c4;
    --border: #f0c98a;
    --text: #3a2410;
    --text-dim: #8a6a3c;
    --accent: #e8752c;
    --err: #c0392b;
    --ok: #4c7a3f;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 0 0 auto;
  }
  header .header-text { flex: 1; min-width: 0; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .header-text p { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  #btn-theme-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  #btn-theme-toggle:hover { background: var(--surface); }

  #stage { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; cursor: grab; display: block; }
  svg.drag { cursor: grabbing; }
  .edge { fill: none; opacity: .45; }

  #tip {
    position: absolute;
    z-index: 10;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    font-size: 13px;
    pointer-events: none;
    display: none;
  }
  #tip .t { font-weight: 600; margin-bottom: 4px; line-height: 1.4; color: var(--text); }
  #tip .au { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  #tip .a { color: var(--text-dim); line-height: 1.5; max-height: 150px; overflow: hidden; }
  #tip .d { margin-top: 6px; font-size: 11px; color: var(--text-dim); word-break: break-all; }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
  }
</style>
</head>
<body>
  <header>
    <div class="header-text">
      <h1>Citation Snowball</h1>
      <p>Seed centered · references left · citations right — drag to pan, scroll to zoom, hover a paper for its abstract</p>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:var(--teal)"></i>references</span>
      <span><i class="sw" style="background:var(--purple)"></i>seed</span>
      <span><i class="sw" style="background:var(--coral)"></i>citations</span>
    </div>
    <button id="btn-theme-toggle" data-theme-icon onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </header>
  <div id="stage">
    <svg id="svg"><g id="vp"></g></svg>
    <div id="tip"></div>
    <div id="empty">No graph data. Run a snowball from Settings, then click &ldquo;View as graph&rdquo;.</div>
  </div>
  <script src="graph.js"></script>
</body>
</html>
