<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOI Grabber — Trending</title>
  <script src="theme.js"></script>
  <script src="logger.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #17171a; --surface: #212126; --surface-2: #2a2a30; --surface-2-hover: #34343c;
      --border: #34343c; --text: #ece9e4; --text-dim: #9d9a94;
      --accent: #c98a4b; --accent-hover: #dd9c5c; --accent-text: #201406;
      --ok: #4caf78; --err: #e0574a; --warn: #c9a24b;
    }
    :root[data-theme="parchment"] {
      --bg: #f2ece0;
      --surface: #ffffff;
      --surface-2: #e7ddc8;
      --surface-2-hover: #dccdae;
      --border: #d8cbae;
      --text: #2a2723;
      --text-dim: #726a5c;
      --accent: #b4783c;
      --accent-hover: #c68a4d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #a9812f;
    }

    :root[data-theme="slate"] {
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-2: #e3e8ee;
      --surface-2-hover: #d3dae3;
      --border: #d3dae3;
      --text: #23282f;
      --text-dim: #6b7280;
      --accent: #4f6d8f;
      --accent-hover: #5f7fa3;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #a9812f;
    }

    :root[data-theme="sage"] {
      --bg: #f0f2ec;
      --surface: #ffffff;
      --surface-2: #e4e8dc;
      --surface-2-hover: #d4dac6;
      --border: #d4dac6;
      --text: #262b22;
      --text-dim: #6f7566;
      --accent: #6b8e5a;
      --accent-hover: #7fa06d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
      --warn: #a9812f;
    }

    :root[data-theme="minimal"] {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-2: #f0f0f0;
      --surface-2-hover: #e2e2e2;
      --border: #dddddd;
      --text: #111111;
      --text-dim: #6e6e6e;
      --accent: #111111;
      --accent-hover: #333333;
      --accent-text: #ffffff;
      --ok: #1a7a4c;
      --err: #b3261e;
      --warn: #8a6d1a;
    }

    :root[data-theme="carrot"] {
      --bg: #fdf3e7;
      --surface: #ffffff;
      --surface-2: #fbe4c4;
      --surface-2-hover: #f5d4a4;
      --border: #f0c98a;
      --text: #3a2410;
      --text-dim: #8a6a3c;
      --accent: #e8752c;
      --accent-hover: #f28943;
      --accent-text: #ffffff;
      --ok: #4a8f3c;
      --err: #c0392b;
      --warn: #b4781e;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 28px 32px; max-width: 1000px; margin: 0 auto; }
    a { color: var(--accent); }
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .flame { color: var(--warn); }
    .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }
    button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: none; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: var(--surface-2); color: var(--text); }
    button.secondary:hover { background: var(--surface-2-hover); }
    .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; }
    .seg button { background: transparent; color: var(--text-dim); padding: 5px 11px; font-size: 12px; }
    .seg button.on { background: var(--accent); color: var(--accent-text); }
    select { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    input[type="text"] { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; }
    .action-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .action-bar .spacer { flex: 1; }
    #search-input { min-width: 200px; }
    #progress-bar-wrap { display: none; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    #progress-bar { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
    #batch-run-controls { display: none; gap: 8px; margin-bottom: 12px; }
    #status-line { font-size: 12px; color: var(--text-dim); min-height: 16px; margin-bottom: 12px; }
    .work-row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-top: 1px solid var(--border); }
    .work-row.no-doi { opacity: 0.55; }
    .work-row input[type="checkbox"] { width: 15px; height: 15px; flex: 0 0 auto; }
    .work-velocity { flex: 0 0 92px; display: flex; flex-direction: column; gap: 4px; }
    .vp { font-size: 12px; font-weight: 600; color: var(--warn); white-space: nowrap; }
    .work-velocity svg { color: var(--warn); }
    .work-info { flex: 1; min-width: 0; }
    .work-title { font-size: 14px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .work-title.has-abstract { cursor: help; }
    .work-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .find-similar { color: var(--accent); cursor: pointer; text-decoration: underline; }
    .work-status { flex: 0 0 auto; font-size: 12px; color: var(--text-dim); min-width: 90px; text-align: right; }
    .work-status.ok { color: var(--ok); }
    .work-status.err { color: var(--err); }
    .work-status.pending { color: var(--warn); }
    #loading, #error, #empty, #no-matches { padding: 24px 4px; font-size: 13px; color: var(--text-dim); }
    #error { color: var(--err); }
    #error, #empty, #no-matches { display: none; }
    #abstract-tooltip { display: none; position: fixed; max-width: 420px; padding: 10px 12px; font-size: 12px; line-height: 1.5; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.28); z-index: 50; }
    .skeleton-bar { height: 10px; background: var(--surface-2); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="flame">▲</span><span id="topic-name">Topic</span></h1>
    <div class="spacer" style="flex:1;"></div>
    <button id="btn-follow-topic" class="secondary" disabled>Follow This Topic</button>
    <button id="btn-theme-toggle" class="secondary" data-theme-icon>🌙</button>
  </div>
  <div class="subtitle" id="subtitle">Loading…</div>

  <div class="controls">
    <div class="seg" id="window-seg">
      <button data-window="6">6 mo</button>
      <button data-window="12" class="on">12 mo</button>
      <button data-window="24">24 mo</button>
    </div>
    <select id="sort-select">
      <option value="velocity">Citation velocity</option>
      <option value="momentum">Recent momentum</option>
      <option value="citations">Total citations</option>
    </select>
    <label class="chk"><input type="checkbox" id="downloadable-only" checked /> Downloadable only</label>
    <input type="text" id="search-input" placeholder="Filter by title…" />
  </div>

  <div class="action-bar">
    <button id="btn-select-all" class="secondary">Select All</button>
    <button id="btn-select-none" class="secondary">Select None</button>
    <button id="btn-download" disabled>Download Selected</button>
    <button id="btn-retry-failed" class="secondary" style="display:none;">Retry Failed</button>
    <button id="btn-open-folder" class="secondary" style="display:none;">Open Folder</button>
  </div>

  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="batch-run-controls">
    <button id="btn-batch-pause" class="secondary">Pause</button>
    <button id="btn-batch-cancel" class="secondary">Cancel</button>
  </div>
  <div id="status-line"></div>

  <div id="loading">Loading trending papers…</div>
  <div id="error"></div>
  <div id="empty">No trending papers found for this topic in this window.</div>
  <div id="list"></div>
  <div id="no-matches">No papers match your filter.</div>

  <div id="abstract-tooltip"></div>

  <script src="keywords.js"></script>
  <script src="trending.js"></script>
</body>
</html>
