<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOI Grabber — Citation Snowball</title>
  <script src="theme.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #17171a;
      --surface: #212126;
      --surface-2: #2a2a30;
      --surface-2-hover: #34343c;
      --border: #34343c;
      --text: #ece9e4;
      --text-dim: #9d9a94;
      --accent: #c98a4b;
      --accent-hover: #dd9c5c;
      --accent-text: #201406;
      --ok: #4caf78;
      --err: #e0574a;
    }

    :root[data-theme="parchment"] {
      --bg: #f2ece0;
      --surface: #ffffff;
      --surface-2: #e7ddc8;
      --surface-2-hover: #dccdae;
      --border: #d8cbae;
      --text: #2a2723;
      --text-dim: #726a5c;
      --accent: #b4783c;
      --accent-hover: #c68a4d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
    }

    :root[data-theme="slate"] {
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-2: #e3e8ee;
      --surface-2-hover: #d3dae3;
      --border: #d3dae3;
      --text: #23282f;
      --text-dim: #6b7280;
      --accent: #4f6d8f;
      --accent-hover: #5f7fa3;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
    }

    :root[data-theme="sage"] {
      --bg: #f0f2ec;
      --surface: #ffffff;
      --surface-2: #e4e8dc;
      --surface-2-hover: #d4dac6;
      --border: #d4dac6;
      --text: #262b22;
      --text-dim: #6f7566;
      --accent: #6b8e5a;
      --accent-hover: #7fa06d;
      --accent-text: #ffffff;
      --ok: #2f8f5d;
      --err: #c0392b;
    }

    :root[data-theme="minimal"] {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-2: #f0f0f0;
      --surface-2-hover: #e2e2e2;
      --border: #dddddd;
      --text: #111111;
      --text-dim: #6e6e6e;
      --accent: #111111;
      --accent-hover: #333333;
      --accent-text: #ffffff;
      --ok: #1a7a4c;
      --err: #b3261e;
    }

    :root[data-theme="carrot"] {
      --bg: #fdf3e7;
      --surface: #ffffff;
      --surface-2: #fbe4c4;
      --surface-2-hover: #f5d4a4;
      --border: #f0c98a;
      --text: #3a2410;
      --text-dim: #8a6a3c;
      --accent: #e8752c;
      --accent-hover: #f28943;
      --accent-text: #ffffff;
      --ok: #4a8f3c;
      --err: #c0392b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 820px;
      margin: 0 auto;
      padding-bottom: 48px;
    }

    header {
      padding: 24px 24px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    header .header-text { flex: 1; min-width: 0; }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

    #btn-theme-toggle {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    #btn-theme-toggle:hover { background: var(--surface-2-hover); }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:hover:not(:disabled) { background: var(--surface-2-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #status-card {
      margin: 0 24px 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    #status-text { font-size: 13px; color: var(--text); }
    #status-text.err { color: var(--err); }
    #status-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    #results { padding: 0 24px; }
    #results .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    #results .list {
      max-height: 480px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    #results .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    #results .row:last-child { border-bottom: none; }
    #results .row-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    #results .row-tag { opacity: 0.55; }
    #results .row-link {
      opacity: 0.7;
      white-space: nowrap;
      flex: 0 0 auto;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-text">
      <h1>Citation Snowball</h1>
      <p id="run-desc">Loading run parameters…</p>
    </div>
    <button id="btn-theme-toggle" data-theme-icon onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </header>

  <div id="status-card">
    <div id="status-text">Starting…</div>
    <div id="status-sub"></div>
  </div>

  <div id="results"></div>

  <script src="snowball.js"></script>
</body>
</html>
